version: 0.1
component: build
shell: bash

env:
  variables:
    DOCKER_USERNAME: casrhub
    IMAGE_NAME: todolistapp-springboot
  exportedVariables:            # 👈 so later steps can read it
    - IMAGE_TAG

steps:
  # 0. Compute an immutable tag (7-char Git SHA here)
  - type: Command
    name: Set IMAGE_TAG
    command: |
      # Toma los 7 primeros caracteres del commit del gatillo
      export IMAGE_TAG=$(echo "${OCI_PRIMARY_SOURCE_COMMIT_HASH:-$OCI_PRIMARY_SOURCE_REVISION}" | cut -c1-7)
      echo "IMAGE_TAG=$IMAGE_TAG"


  - type: Command
    name: Docker Hub Login
    command: |
      echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

  - type: Command
    name: Build & Push Docker Image
    timeoutInSeconds: 1800
    command: |
      docker build -t ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG} \
                   -f MtdrSpring/backend/Dockerfile \
                   MtdrSpring/backend
      # optional convenience tag
      docker tag  ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG} \
                  ${DOCKER_USERNAME}/${IMAGE_NAME}:latest
      docker push ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}
      docker push ${DOCKER_USERNAME}/${IMAGE_NAME}:latest

  - type: Command
    name: Run OWASP ZAP Scan
    timeoutInSeconds: 600
    command: |
     echo "▶️  Ejecutando ZAP Quick Scan (solo reporte en consola)…"

     # Lanzamos ZAP, mostramos progreso y descartamos su código de salida
     docker run --rm \
      ghcr.io/zaproxy/zaproxy:stable \
      zap.sh -cmd \
             -quickurl http://220.158.74.30/ \
             -quickprogress || true   # ← ignora el exit code

     echo "ℹ️  ZAP finalizado; si hubo alertas las viste más arriba."



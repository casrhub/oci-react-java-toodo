version: 0.1
component: build
shell: bash           # global default
env:
  variables:
    DOCKER_USERNAME: casrhub
    IMAGE_NAME: todolistapp-springboot
    IMAGE_TAG: 0.1

steps:
  # 1. Build the JAR
  - type: Command
    name: Build Spring Boot JAR
    image: maven:3.9.6-eclipse-temurin-11
    timeoutInSeconds: 1800             # ⭐ Maven + JDK 11
    workingDirectory: MtdrSpring/backend
    command: |
      ./mvnw -B clean package spring-boot:repackage -DskipTests

  # 2. Build & push the container (runner image already has Docker CLI)
  - type: Command
    name: Build & Push Docker image
    command: |
      docker build -t ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG} \
                   -f MtdrSpring/backend/Dockerfile \
                   MtdrSpring/backend
      docker push  ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}

name: Backend CI

on:
  push:
    branches: [main, dev, LinuxTaks]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Build backend JAR (skip tests)
        working-directory: MtdrSpring/backend
        run: mvn --batch-mode clean package -DskipTests

      # Opcional – subir el artefacto para descargarlo
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyTodoList-jar
          path: MtdrSpring/backend/target/MyTodoList-0.0.1-SNAPSHOT.jar

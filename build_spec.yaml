version: 0.1
component: build

env:
  variables:
    DOCKER_USERNAME: casrhub
    IMAGE_NAME: todolistapp-springboot
    IMAGE_TAG: 0.1
    JAVA_HOME: /usr/lib/jvm/java-22-openjdk-amd64  # ✅ Declare here so it's available in all steps

steps:
  - type: Command
    name: Docker Hub Login
    command: |
      echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

  - type: Command
    name: Copy Wallet Files
    command: |
      cp -r MtdrSpring/Wallet_FATDATABASE MtdrSpring/backend/

  - type: Command
    name: Set Execution Permission for mvnw
    command: |
      chmod +x MtdrSpring/backend/mvnw

   - type: Command
    name: Build Spring Boot JAR
    timeoutInMinutes: 20
    command: |
      export JAVA_HOME=/usr/lib/jvm/java-22-openjdk-amd64
      export PATH=$JAVA_HOME/bin:$PATH
      cd MtdrSpring/backend
      ./mvnw clean package spring-boot:repackage -DskipTests

  - type: Command
    name: Build & Push Docker Image
    command: |
      docker build \
        -t ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG} \
        -f MtdrSpring/backend/Dockerfile \
        MtdrSpring/backend

      docker push ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}

outputArtifacts:
  - name: todolist-image
    type: DOCKER_IMAGE
    location: ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}

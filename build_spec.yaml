version: 0.1
component: build
shell: bash

env:
  variables:
    DOCKER_USERNAME: casrhub
    IMAGE_NAME: todolistapp-springboot
    IMAGE_TAG: 0.1

steps:
  - type: Command
    name: Build Spring Boot JAR
    timeoutInSeconds: 1800
    command: |
    microdnf install -y java-11-openjdk-devel   # ← works on Oracle Linux
    export JAVA_HOME=/usr/lib/jvm/java-11
    export PATH=$JAVA_HOME/bin:$PATH
    java -version                                # sanity log
    mvn -f MtdrSpring/backend/pom.xml \
        -B clean package spring-boot:repackage -DskipTests


  - type: Command
    name: Build & Push Docker image
    command: |
      docker build -t ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG} \
                   -f MtdrSpring/backend/Dockerfile \
                   MtdrSpring/backend
      docker push  ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}

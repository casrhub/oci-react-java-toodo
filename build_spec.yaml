version: 0.1
component: build
shell: bash

env:
  variables:
    DOCKER_USERNAME: casrhub
    IMAGE_NAME: todolistapp-springboot
  exportedVariables:            # 👈 so later steps can read it
    - IMAGE_TAG

steps:
  # 0. Compute an immutable tag (7-char Git SHA here)
  - type: Command
    name: Set IMAGE_TAG
    command: |
     IMAGE_TAG=$(echo "${OCI_PRIMARY_SOURCE_COMMIT_HASH:-$OCI_PRIMARY_SOURCE_REVISION}" | cut -c1-7)
     echo "IMAGE_TAG=$IMAGE_TAG"   # log
     # 👇 export for later steps / downstream pipeline
     echo "IMAGE_TAG=$IMAGE_TAG" >> "$OCI_BUILD_RUN_EXPORT_VARIABLES_FILE"


  - type: Command
    name: Docker Hub Login
    command: |
      echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

  - type: Command
    name: Build & Push Docker Image
    timeoutInSeconds: 1800
    command: |
      docker build -t ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG} \
                   -f MtdrSpring/backend/Dockerfile \
                   MtdrSpring/backend
      # optional convenience tag
      docker tag  ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG} \
                  ${DOCKER_USERNAME}/${IMAGE_NAME}:latest
      docker push ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}
      docker push ${DOCKER_USERNAME}/${IMAGE_NAME}:latest
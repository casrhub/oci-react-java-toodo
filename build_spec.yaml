version: 0.1
component: build

env:
  variables:
    DOCKER_USERNAME: casrhub
    IMAGE_NAME: todolistapp-springboot
    IMAGE_TAG: 0.1

steps:
  - type: Command
    name: Docker Hub Login
    command: |
      echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

  - type: Command
    name: Copy Wallet Files
    command: |
      cp -r MtdrSpring/Wallet_FATDATABASE MtdrSpring/backend/

  - type: Command
    name: Set Execution Permission for mvnw
    command: |
      chmod +x MtdrSpring/backend/mvnw

  - type: Command
    name: Check Java Installations
    command: |
      java -version
      ls -la /usr/lib/jvm

  - type: Command
    name: Set JAVA_HOME
    command: |
      export JAVA_HOME=/usr/lib/jvm/java-22-openjdk-amd64
      echo "JAVA_HOME set to: $JAVA_HOME"


  - type: Command
    name: Build Spring Boot JAR
    command: |
      cd MtdrSpring/backend
      ./mvnw clean package spring-boot:repackage -DskipTests

  - type: Command
    name: Build & Push Docker Image
    command: |
      docker build \
        -t ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG} \
        -f MtdrSpring/backend/Dockerfile \
        MtdrSpring/backend

      docker push ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}

outputArtifacts:
  - name: todolist-image
    type: DOCKER_IMAGE
    location: ${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}
